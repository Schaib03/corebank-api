spring:
  application:
    name: corebank-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/corebank}
    username: ${DATABASE_USERNAME:corebank}
    password: ${DATABASE_PASSWORD:corebank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

corebank:
  jwt:
    # HS256 needs at least 256 bits. Override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    issuer: corebank-api
    ttl: ${JWT_TTL:PT1H}
  admin:
    # Bootstrap admin, created at startup if the email does not exist yet.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  server:
    port: ${MANAGEMENT_PORT:${server.port}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
