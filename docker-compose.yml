services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corebank
      POSTGRES_USER: corebank
      POSTGRES_PASSWORD: corebank
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebank -d corebank"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/corebank
      DATABASE_USERNAME: corebank
      DATABASE_PASSWORD: corebank
      JWT_SECRET: ${JWT_SECRET:-compose-only-secret-change-me-0123456789}
      MANAGEMENT_PORT: "8081"
      ADMIN_EMAIL: admin@corebank.local
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
