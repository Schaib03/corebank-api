name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: corebank
          POSTGRES_USER: corebank
          POSTGRES_PASSWORD: corebank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corebank"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Point the integration tests at PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/corebank" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_USERNAME=corebank" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=corebank" >> "$GITHUB_ENV"
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.database }}
          path: |
            target/surefire-reports
            target/failsafe-reports

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
